<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10111b">
<title>NEURA LOCAL</title>

<style>
:root{
 --bg:#10111b;
 --panel:#171925;
 --panel2:#202333;
 --text:#f4f5ff;
 --muted:#999bb4;
 --accent:#8b5cf6;
 --border:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,Arial,sans-serif;
 height:100dvh;
 overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
.app{display:flex;height:100dvh}
.sidebar{
 width:270px;background:#141521;
 border-right:1px solid var(--border);
 padding:15px;display:flex;
 flex-direction:column;gap:14px;
}
.logo{font-size:24px;font-weight:900;padding:12px}
.logo span{color:var(--accent)}
.new-chat{
 border:0;background:var(--accent);
 padding:14px;border-radius:14px;font-weight:800
}
.search{
 width:100%;padding:12px;
 background:var(--panel2);
 border:1px solid var(--border);
 border-radius:12px;color:var(--text)
}
.history{flex:1;overflow:auto}
.history-item{
 padding:12px;border-radius:12px;color:var(--muted);
 overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;cursor:pointer
}
.history-item:hover{background:var(--panel2)}
.history-item.active{background:var(--panel2);color:var(--text)}
.settings-button{
 width:100%;padding:12px;border-radius:12px;
 border:1px solid var(--border);background:var(--panel2)
}
.main{
 flex:1;min-width:0;display:flex;
 flex-direction:column
}
.topbar{
 height:64px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;padding:0 16px;gap:12px
}
.top-title{font-weight:800}
.top-status{color:var(--muted);font-size:12px}
.icon{
 background:var(--panel2);border:1px solid var(--border);
 border-radius:12px;padding:10px
}
#menu{display:none}
.chat{flex:1;overflow:auto;padding:20px 12px}
.messages{max-width:850px;margin:auto}
.welcome{text-align:center;padding:8vh 10px 30px}
.welcome h1{font-size:36px;margin:0 0 12px}
.welcome h1 span{color:var(--accent)}
.welcome p{color:var(--muted)}
.cards{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;max-width:700px;margin:25px auto
}
.card{
 background:var(--panel);border:1px solid var(--border);
 padding:16px;border-radius:16px;text-align:left
}
.card:hover{border-color:var(--accent)}
.message{
 display:flex;gap:12px;margin:22px 0;
 animation:fade .2s
}
@keyframes fade{
 from{opacity:0;transform:translateY(6px)}
 to{opacity:1;transform:translateY(0)}
}
.message.user{flex-direction:row-reverse}
.avatar{
 width:36px;height:36px;flex-shrink:0;
 border-radius:12px;display:flex;align-items:center;
 justify-content:center;background:var(--accent);font-weight:900
}
.user .avatar{background:var(--panel2)}
.bubble{
 max-width:90%;min-width:0;background:var(--panel);
 border:1px solid var(--border);border-radius:18px;
 padding:14px;line-height:1.65;overflow-wrap:anywhere
}
.user .bubble{background:var(--panel2)}
.bubble img{
 max-width:100%;max-height:400px;border-radius:12px;
 display:block;margin:10px 0
}
.bubble pre{
 overflow:auto;padding:12px;background:#0b0c13;
 border-radius:12px
}
.bubble code{overflow-wrap:anywhere}
.bubble table{border-collapse:collapse;width:100%}
.bubble td,.bubble th{
 border:1px solid var(--border);padding:8px
}
.actions{
 display:flex;gap:5px;flex-wrap:wrap;margin-top:8px
}
.actions button{
 border:0;background:transparent;color:var(--muted);
 padding:7px;border-radius:8px
}
.actions button:hover{background:var(--panel2);color:var(--text)}
.typing{display:flex;gap:5px;padding:8px}
.typing i{
 width:7px;height:7px;border-radius:50%;
 background:var(--muted);animation:up 1s infinite alternate
}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes up{to{transform:translateY(-5px);opacity:.4}}
.composer-wrap{padding:12px 16px 18px}
.composer{max-width:850px;margin:auto}
.preview{
 display:none;padding:10px;background:var(--panel);
 border-radius:14px;margin-bottom:8px
}
.preview img{max-height:120px;max-width:160px;border-radius:10px}
.preview button{
 border:0;background:var(--panel2);padding:8px;border-radius:10px
}
.inputbox{
 display:flex;gap:8px;align-items:flex-end;padding:10px;
 background:var(--panel);border:1px solid var(--border);
 border-radius:22px
}
.inputbox textarea{
 flex:1;min-width:0;resize:none;max-height:180px;
 background:transparent;color:var(--text);border:0;
 outline:0;padding:10px;line-height:1.5
}
.send{
 background:var(--accent);border:0;border-radius:14px;
 width:44px;height:44px;font-weight:900
}
.send:disabled{opacity:.4}
.attach{
 background:var(--panel2);border:0;border-radius:14px;padding:12px
}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}
.sheet{
 position:fixed;inset:0;background:rgba(0,0,0,.55);
 display:none;align-items:center;justify-content:center;
 padding:16px;z-index:10
}
.sheet.open{display:flex}
.modal{
 width:min(450px,100%);background:var(--panel);
 border:1px solid var(--border);border-radius:22px;padding:22px
}
.modal label{display:block;color:var(--muted);margin:16px 0 8px}
.modal input,.modal select{
 width:100%;background:var(--panel2);color:var(--text);
 padding:12px;border:1px solid var(--border);border-radius:12px
}
.modal .close{
 margin-top:20px;width:100%;background:var(--accent);
 border:0;border-radius:12px;padding:12px
}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.color{width:35px;height:35px;border-radius:50%;border:2px solid white}
body.light{
 --bg:#f4f5fa;--panel:#fff;--panel2:#e9eaf2;
 --text:#181923;--muted:#72748b;--border:rgba(0,0,0,.1)
}
@media(max-width:700px){
 .sidebar{
  position:fixed;left:0;top:0;bottom:0;
  transform:translateX(-100%);transition:.25s;
  z-index:5;width:270px
 }
 .sidebar.open{transform:translateX(0)}
 #menu{display:block}
 .cards{grid-template-columns:1fr}
 .welcome h1{font-size:30px}
 .chat{padding:12px 8px}
 .composer-wrap{padding:8px}
}
</style>

<script type="module">

/* ======================================
   CONFIGURATION
====================================== */

const CONFIG={
 model:"onnx-community/Qwen2.5-0.5B-Instruct",
 maxHistory:10,
 maxImageSize:10*1024*1024,
 maxOutput:500,
 temperature:0.65,

 systemPrompt:`
Ты NEURA — универсальный интеллектуальный помощник.

Ты умеешь:
- Отвечать на вопросы о людях, истории, науке,
  технологиях, географии и культуре.
- Объяснять сложные темы простыми словами.
- Решать математические задачи.
- Помогать писать сочинения, рассказы, тексты.
- Анализировать тексты.
- Переводить языки.
- Помогать с программированием.
- Объяснять значения слов и терминов.
- Отвечать в контексте предыдущих сообщений.

Правила:
1. Отвечай на русском, если пользователь пишет по-русски.
2. Не выдумывай факты.
3. Если не уверен, честно сообщи.
4. Объясняй понятно и структурированно.
5. Не повторяй вопрос без необходимости.
6. Если просят кратко — отвечай кратко.
7. Используй Markdown.
8. Для математики объясняй ход решения.
9. Для программирования давай примеры.
10. Будь полезным и внимательным.
`
};

/* ======================================
   DOM
====================================== */

const $=id=>document.getElementById(id);

const ui={
 sidebar:$("sidebar"),
 messages:$("messages"),
 chat:$("chat"),
 input:$("input"),
 send:$("send"),
 stop:$("stop"),
 file:$("file"),
 preview:$("preview"),
 previewImage:$("previewImage"),
 history:$("history"),
 search:$("search"),
 status:$("status"),
 modelInfo:$("modelInfo"),
 ocrPreview:$("ocrPreview")
};

/* ======================================
   STATE
====================================== */

let chats=[];
let currentId=null;
let pendingImage=null;
let pendingOCR="";
let busy=false;
let controller=null;
let aiPipeline=null;
let aiReady=false;
let aiLoading=false;

/* ======================================
   ID
====================================== */

function uid(){
 return Date.now().toString()+
 Math.random().toString(36).slice(2);
}

/* ======================================
   CURRENT CHAT
====================================== */

function current(){
 return chats.find(c=>c.id===currentId);
}

/* ======================================
   SAVE
====================================== */

function save(){
 try{
  localStorage.setItem(
   "neura_local_chats",
   JSON.stringify(chats)
  );
 }catch(e){
  console.warn("Сохранение не удалось",e);
 }
}

/* ======================================
   LOAD CHATS
====================================== */

function load(){

 try{
  chats=JSON.parse(
   localStorage.getItem("neura_local_chats")||"[]"
  );
 }catch(e){
  chats=[];
 }

 if(!chats.length){
  createChat();
 }else{
  currentId=chats[0].id;
  draw();
 }
}

/* ======================================
   NEW CHAT
====================================== */

function createChat(){

 const c={
  id:uid(),
  title:"Новый чат",
  messages:[]
 };

 chats.unshift(c);
 currentId=c.id;

 save();
 draw();
 welcome();
}

/* ======================================
   WELCOME
====================================== */

function welcome(){

 ui.messages.innerHTML=`
 <div class="welcome">

 <h1>Привет, я <span>NEURA</span></h1>

 <p>
 Локальный помощник для вопросов,
 обучения, текстов и вычислений.
 </p>

 <div class="cards">

 <button class="card" data-task="math">
 📐 Решить пример
 </button>

 <button class="card" data-task="essay">
 ✍️ Написать сочинение
 </button>

 <button class="card" data-task="explain">
 📚 Объяснить тему
 </button>

 <button class="card" data-task="work">
 💼 Помочь с задачей
 </button>

 <button class="card" data-task="translate">
 🌍 Перевести текст
 </button>

 <button class="card" data-task="ocr">
 📷 Прочитать фото
 </button>

 </div>
 </div>
 `;

 document.querySelectorAll("[data-task]").forEach(b=>{
  b.onclick=()=>{
   const prompts={
    math:"Реши пример и объясни шаги: ",
    essay:"Напиши сочинение на тему: ",
    explain:"Объясни простыми словами: ",
    work:"Помоги с задачей: ",
    translate:"Переведи текст: ",
    ocr:"Прочитай текст на фото."
   };

   ui.input.value=prompts[b.dataset.task];
   ui.input.focus();
  };
 });
}

/* ======================================
   HISTORY
====================================== */

function renderHistory(){

 const query=ui.search.value.toLowerCase();

 ui.history.innerHTML=chats
  .filter(c=>c.title.toLowerCase().includes(query))
  .map(c=>`
   <div class="history-item ${c.id===currentId?"active":""}"
        data-id="${c.id}">
    ${escapeHTML(c.title)}
   </div>
  `)
  .join("");

 ui.history.querySelectorAll(".history-item")
 .forEach(el=>{
  el.onclick=()=>{
   currentId=el.dataset.id;
   draw();
   ui.sidebar.classList.remove("open");
  };
 });
}

/* ======================================
   HTML SECURITY
====================================== */

function escapeHTML(s){

 return String(s??"").replace(/[&<>"']/g,c=>{
  const map={
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  };
  return map[c];
 });
}

/* ======================================
   MARKDOWN FORMAT
====================================== */

function formatText(text){

 let s=escapeHTML(text);

 s=s.replace(/```([\s\S]*?)```/g,
  "<pre><code>$1</code></pre>");

 s=s.replace(/`([^`]+)`/g,
  "<code>$1</code>");

 s=s.replace(/\*\*([^*]+)\*\*/g,
  "<strong>$1</strong>");

 s=s.replace(/\*([^*]+)\*/g,
  "<em>$1</em>");

 s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>");
 s=s.replace(/^## (.*)$/gm,"<h2>$1</h2>");
 s=s.replace(/^# (.*)$/gm,"<h1>$1</h1>");

 s=s.replace(/^- (.*)$/gm,"• $1");
 s=s.replace(/\n/g,"<br>");

 return s;
}

/* ======================================
   DRAW
====================================== */

function draw(){

 const c=current();

 if(!c){
  welcome();
  return;
 }

 if(!c.messages.length){
  welcome();
  renderHistory();
  return;
 }

 ui.messages.innerHTML=c.messages.map((m,i)=>{

  const user=m.role==="user";

  return `
  <div class="message ${user?"user":"assistant"}">

   <div class="avatar">${user?"Я":"N"}</div>

   <div>

    <div class="bubble">

    ${m.image?
     `<img src="${m.image}" alt="Фото">`
     :""
    }

    ${formatText(m.text||"")}

    </div>

    ${!user?
    `<div class="actions">
     <button data-copy="${i}">📋 Копировать</button>
     <button data-retry="${i}">↻ Повторить</button>
    </div>`
    :""
    }

   </div>
  </div>
  `;
 }).join("");

 ui.messages.querySelectorAll("[data-copy]")
 .forEach(b=>{
  b.onclick=()=>{
   const m=c.messages[+b.dataset.copy];
   navigator.clipboard?.writeText(m.text||"");
  };
 });

 ui.messages.querySelectorAll("[data-retry]")
 .forEach(b=>{
  b.onclick=()=>{
   retry(+b.dataset.retry);
  };
 });

 renderHistory();
 scrollBottom();
}

/* ======================================
   SCROLL
====================================== */

function scrollBottom(){
 ui.chat.scrollTop=ui.chat.scrollHeight;
}

/* ======================================
   BUSY
====================================== */

function setBusy(value){

 busy=value;

 ui.send.style.display=value?"none":"block";
 ui.stop.style.display=value?"block":"none";

 ui.input.disabled=value;
 $("attach").disabled=value;
}

/* ======================================
   TYPING
====================================== */

function showTyping(){

 const el=document.createElement("div");
 el.className="message assistant";
 el.id="typing";

 el.innerHTML=`
 <div class="avatar">N</div>
 <div class="bubble">
 <div class="typing"><i></i><i></i><i></i></div>
 </div>
 `;

 ui.messages.appendChild(el);
 scrollBottom();
}

function removeTyping(){
 $("typing")?.remove();
}

/* ======================================
   MODEL LOADER
====================================== */

async function loadAI(){

 if(aiReady)return true;
 if(aiLoading)return false;

 aiLoading=true;
 ui.status.textContent="Загрузка модели...";

 ui.modelInfo.textContent="Загрузка...";

 try{

  const {pipeline}=await import(
   "https://cdn.jsdelivr.net/npm/@huggingface/transformers"
  );

  aiPipeline=await pipeline(
   "text-generation",
   CONFIG.model,
   {
    progress_callback:p=>{

     if(p.status==="progress"){

      const percent=Math.round(p.progress||0);

      ui.modelInfo.textContent=
       "Загрузка: "+percent+"%";
     }
    }
   }
  );

  aiReady=true;

  ui.status.textContent="Модель готова";
  ui.modelInfo.textContent="ИИ загружен";

  return true;

 }catch(error){

  console.error(error);

  ui.status.textContent="Ошибка модели";

  ui.modelInfo.textContent=
   "Не удалось загрузить модель. Проверь сеть и браузер.";

  return false;

 }finally{

  aiLoading=false;
 }
}

/* ======================================
   MATH TOKENIZER
====================================== */

function tokenizeMath(expression){

 const tokens=[];
 let i=0;

 while(i<expression.length){

  const c=expression[i];

  if(/\s/.test(c)){
   i++;
   continue;
  }

  if(/[0-9.]/.test(c)){

   let n="";

   while(i<expression.length&&/[0-9.]/.test(expression[i])){
    n+=expression[i++];
   }

   if((n.match(/\./g)||[]).length>1){
    throw new Error("Некорректное число");
   }

   tokens.push({type:"number",value:Number(n)});
   continue;
  }

  if(/[+\-*/^()%]/.test(c)){
   tokens.push({type:"operator",value:c});
   i++;
   continue;
  }

  throw new Error("Неизвестный символ "+c);
 }

 return tokens;
}

/* ======================================
   MATH PARSER
====================================== */

function parseMath(expression){

 const tokens=tokenizeMath(expression);
 let position=0;

 function peek(){return tokens[position]}
 function consume(){return tokens[position++]}

 function primary(){

  const t=peek();

  if(!t)throw new Error("Конец выражения");

  if(t.value==="("){

   consume();
   const v=add();

   if(peek()?.value!==")"){
    throw new Error("Нет скобки");
   }

   consume();
   return v;
  }

  if(t.value==="-"){
   consume();
   return -primary();
  }

  if(t.value==="+"){
   consume();
   return primary();
  }

  if(t.type==="number"){
   consume();
   return t.value;
  }

  throw new Error("Ошибка выражения");
 }

 function power(){

  let a=primary();

  if(peek()?.value==="^"){
   consume();
   a=Math.pow(a,power());
  }

  return a;
 }

 function mul(){

  let a=power();

  while(peek()&&["*","/","%"].includes(peek().value)){

   const op=consume().value;
   const b=power();

   if(op==="*")a*=b;
   if(op==="/")a/=b;
   if(op==="%")a%=b;
  }

  return a;
 }

 function add(){

  let a=mul();

  while(peek()&&["+","-"].includes(peek().value)){

   const op=consume().value;
   const b=mul();

   if(op==="+")a+=b;
   if(op==="-")a-=b;
  }

  return a;
 }

 const result=add();

 if(position!==tokens.length){
  throw new Error("Некорректное выражение");
 }

 if(!Number.isFinite(result)){
  throw new Error("Результат не определён");
 }

 return result;
}

/* ======================================
   MATH
====================================== */

function mathAnswer(text){

 let expression=text
  .replace(/,/g,".")
  .replace(/[?=]/g," ")
  .trim();

 expression=expression.replace(
  /^(реши|посчитай|вычисли|calculate|solve)\s*/i,
  ""
 );

 expression=expression.replace(
  /^(пример|задача)\s*/i,
  ""
 );

 if(!/^[0-9+\-*/^().%\s]+$/.test(expression)){
  return null;
 }

 try{

  const result=parseMath(expression);

  return `
**Результат: ${result}**

Выражение: \`${expression}\`

**Ответ: ${result}**
  `.trim();

 }catch(e){

  return null;
 }
}

/* ======================================
   GCD
====================================== */

function gcd(a,b){

 a=Math.abs(a);
 b=Math.abs(b);

 while(b){
  const t=b;
  b=a%b;
  a=t;
 }

 return a;
}

/* ======================================
   LCM
====================================== */

function lcm(a,b){

 if(!a||!b)return 0;

 return Math.abs(a*b)/gcd(a,b);
}

/* ======================================
   PERCENTAGES
====================================== */

function percentage(text){

 const match=text.match(
  /(\d+(?:[.,]\d+)?)\s*%.*?(\d+(?:[.,]\d+)?)/i
 );

 if(!match)return null;

 const percent=Number(match[1].replace(",","."));
 const value=Number(match[2].replace(",","."));

 const result=value*percent/100;

 return `${percent}% от ${value} = ${result}`;
}

/* ======================================
   IMAGE OCR
====================================== */

async function readImage(file){

 ui.ocrPreview.textContent="Распознавание...";

 try{

  const {createWorker}=await import(
   "https://cdn.jsdelivr.net/npm/tesseract.js"
  );

  const worker=await createWorker("rus+eng");

  const result=await worker.recognize(file);

  await worker.terminate();

  const text=result.data.text.trim();

  ui.ocrPreview.textContent=text?
   "Распознанный текст: "+text:
   "Текст не обнаружен";

  return text;

 }catch(error){

  console.error(error);

  ui.ocrPreview.textContent=
   "Ошибка распознавания текста";

  return "";
 }
}

/* ======================================
   AI RESPONSE
====================================== */

async function generateAIAnswer(userText){

 if(!aiReady){

  const loaded=await loadAI();

  if(!loaded){
   return "Не удалось загрузить языковую модель.";
  }
 }

 const c=current();

 const history=(c?.messages||[])
  .slice(-CONFIG.maxHistory)
  .map(m=>{
   return (m.role==="assistant"?"NEURA":"Пользователь")
    +": "+(m.text||"");
  })
  .join("\n\n");

 const prompt=`
${CONFIG.systemPrompt}

История:
${history}

Пользователь:
${userText}

NEURA:
`;

 const result=await aiPipeline(prompt,{
  max_new_tokens:CONFIG.maxOutput,
  temperature:CONFIG.temperature,
  do_sample:true,
  return_full_text:false
 });

 const answer=result?.[0]?.generated_text;

 if(typeof answer==="string"){
  return answer.trim();
 }

 return "Модель не смогла сформировать ответ.";
}

/* ======================================
   ANSWER ROUTER
====================================== */

async function answerUser(text,image,ocr){

 const math=mathAnswer(text);

 if(math&&!image){
  return math;
 }

 const percent=percentage(text);

 if(percent&&!image){
  return percent;
 }

 let prompt=text;

 if(image){

  prompt+=`

  Пользователь прикрепил изображение.

  Автоматическое распознавание текста с изображения:
  ${ocr||"Текст не удалось распознать."}

  Если пользователь просит прочитать фото,
  используй распознанный текст.
  Если он просит анализ изображения,
  объясни, что доступен только OCR, а не
  полноценное визуальное распознавание.
  `;
 }

 return await generateAIAnswer(prompt);
}

/* ======================================
   SEND
====================================== */

async function sendMessage(){

 if(busy)return;

 const text=ui.input.value.trim();

 if(!text&&!pendingImage)return;

 const c=current();

 if(!c)return;

 let imageData=null;

 if(pendingImage){

  imageData=await fileToBase64(pendingImage);
 }

 if(!text&&!imageData)return;

 const displayText=text||"Проанализируй фотографию.";

 c.messages.push({
  role:"user",
  text:displayText,
  image:imageData
 });

 if(c.title==="Новый чат"){

  c.title=displayText.slice(0,40)||
   "Фото";
 }

 const image=pendingImage;
 const ocr=pendingOCR;

 ui.input.value="";
 ui.input.style.height="auto";

 pendingImage=null;
 pendingOCR="";

 ui.preview.style.display="none";
 ui.previewImage.src="";
 ui.ocrPreview.textContent="";

 draw();

 setBusy(true);
 showTyping();

 controller=new AbortController();

 try{

  let answer=await answerUser(
   displayText,
   image,
   ocr
  );

  if(controller.signal.aborted){
   answer="Генерация остановлена.";
  }

  removeTyping();

  c.messages.push({
   role:"assistant",
   text:answer
  });

  save();
  draw();

 }catch(error){

  console.error(error);

  removeTyping();

  c.messages.push({
   role:"assistant",
   text:"Произошла ошибка: "+error.message
  });

  save();
  draw();

 }finally{

  controller=null;
  setBusy(false);
 }
}

/* ======================================
   FILE TO BASE64
====================================== */

function fileToBase64(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>resolve(reader.result);
  reader.onerror=reject;

  reader.readAsDataURL(file);
 });
}

/* ======================================
   RETRY
====================================== */

async function retry(index){

 if(busy)return;

 const c=current();

 if(!c)return;

 const message=c.messages[index];

 if(!message||message.role!=="assistant")return;

 const previous=c.messages[index-1];

 if(!previous||previous.role!=="user")return;

 c.messages.splice(index,1);

 const text=previous.text||"";
 const image=null;

 draw();
 setBusy(true);
 showTyping();

 controller=new AbortController();

 try{

  const answer=await answerUser(text,image,"");

  removeTyping();

  c.messages.push({
   role:"assistant",
   text:answer
  });

  save();
  draw();

 }catch(error){

  removeTyping();

  c.messages.push({
   role:"assistant",
   text:"Ошибка генерации."
  });

  save();
  draw();

 }finally{

  controller=null;
  setBusy(false);
 }
}

/* ======================================
   STOP
====================================== */

$("stop").onclick=()=>{

 if(controller){
  controller.abort();
 }

 if(aiPipeline?.dispose){
  // Не уничтожаем модель при остановке,
  // чтобы она оставалась доступной.
 }
};

   EVENTS
====================================== */

$("newChat").onclick=createChat;

$("clear").onclick=()=>{

 const c=current();

 if(!c)return;

 if(confirm("Удалить сообщения этого чата?")){

  c.messages=[];
  c.title="Новый чат";

  save();
  draw();
  welcome();

$("menu").onclick=()=>{
 ui.sidebar.classList.toggle("open");
};

$("search").oninput=renderHistory;

$("attach").onclick=()=>{
 ui.file.click();
};

$("file").onchange=async()=>{

 const file=ui.file.files?.[0];

 if(!file)return;

 if(file.size>CONFIG.maxImageSize){

  alert("Фото слишком большое. Максимум 10 МБ.");
  ui.file.value="";
  return;
 }

 pendingImage=file;

 ui.previewImage.src=
  URL.createObjectURL(file);

 pendingOCR=await readImage(file);

};

 pendingImage=null;
 pendingOCR="";

 ui.preview.style.display="none";
 ui.previewImage.src="";
 ui.ocrPreview.textContent="";
};

$("send").onclick=sendMessage;

ui.input.onkeydown=e=>{

 if(e.key==="Enter"&&!e.shiftKey){

  e.preventDefault();
  sendMessage();
 }
};

ui.input.oninput=()=>{

 ui.input.style.height="auto";

 ui.input.style.height=
  Math.min(ui.input.scrollHeight,180)+"px";
};

   SETTINGS
====================================== */

$("settingsBtn").onclick=()=>{
 $("sheet").classList.add("open");
};

$("close").onclick=()=>{
 $("sheet").classList.remove("open");
};

 }
};

 );

 localStorage.setItem(
  "neura_theme",
  e.target.value
 );
};

  e.target.value+"px";

 localStorage.setItem(
  "neura_font",
  e.target.value
 );
};

document.querySelectorAll(".color").forEach(b=>{

 b.onclick=()=>{

  document.documentElement.style.setProperty(
   "--accent",
   b.dataset.color
  );

  localStorage.setItem(
   "neura_color",
   b.dataset.color
  );
 };
});

$("loadModel").onclick=loadAI;

/* ======================================
   RESTORE SETTINGS
====================================== */

function restoreSettings(){

 const theme=localStorage.getItem("neura_theme");
 const font=localStorage.getItem("neura_font");
 const color=localStorage.getItem("neura_color");

 if(theme){

  $("theme").value=theme;

  document.body.classList.toggle(
   "light",
   theme==="light"
  );
 }

 if(font){

  $("font").value=font;
  document.body.style.fontSize=font+"px";
 }

 if(color){

  document.documentElement.style.setProperty(
   "--accent",
   color
  );
 }
}

/* ======================================
   INIT
====================================== */

restoreSettings();
load();
