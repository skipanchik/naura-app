<meta name='viewport' content='width=device-width, initial-scale=1'/>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>NEURA AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
 --bg:#101116;--panel:#181921;--panel2:#20212b;
 --text:#f5f5fa;--muted:#9294a6;--accent:#8b7cff;
 --border:rgba(255,255,255,.08);--user:#6355ce;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh}
body.light{
 --bg:#f4f4f8;--panel:#fff;--panel2:#e9e9f0;
 --text:#20202a;--muted:#777789;--accent:#6756d8;
 --border:rgba(0,0,0,.09);--user:#6756d8
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:var(--text)}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{
 width:270px;background:var(--panel);border-right:1px solid var(--border);
 display:flex;flex-direction:column;padding:14px;gap:12px;
 transition:transform .25s;flex-shrink:0
}
.brand{display:flex;align-items:center;gap:10px;padding:8px}
.logo{height:40px;width:40px;border-radius:14px;
 background:linear-gradient(135deg,#a394ff,#6552d8);
 display:grid;place-items:center;font-size:20px}
.brand strong{font-size:17px;letter-spacing:.4px}
.newchat{background:var(--accent);border:0;border-radius:13px;
 padding:13px;text-align:left;color:white;font-weight:600}
.search{background:var(--panel2);border:1px solid var(--border);
 border-radius:12px;padding:11px;color:var(--text);width:100%;outline:0}
.chatlist{flex:1;overflow:auto}
.chatitem{padding:12px;border-radius:12px;display:flex;
 align-items:center;justify-content:space-between;gap:8px;
 cursor:pointer;margin-bottom:4px}
.chatitem:hover,.chatitem.active{background:var(--panel2)}
.chatname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.delchat{background:none;border:0;color:var(--muted);padding:4px}
.sidebottom{border-top:1px solid var(--border);padding-top:12px}
.sidebtn{width:100%;background:transparent;border:0;border-radius:12px;
 padding:12px;text-align:left;color:var(--text)}
.sidebtn:hover{background:var(--panel2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:64px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 16px;gap:10px}
.headleft{display:flex;align-items:center;gap:10px}
.headername{font-weight:650}
.headerstatus{font-size:11px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border:1px solid var(--border);
 background:var(--panel);border-radius:13px}
.chat{flex:1;overflow-y:auto;padding:22px 16px;scroll-behavior:smooth}
.chatinner{max-width:760px;margin:auto}
.welcome{text-align:center;padding:45px 10px}
.welcomeicon{width:76px;height:76px;border-radius:25px;
 background:linear-gradient(135deg,#39345b,#7565d9);
 display:grid;place-items:center;font-size:32px;margin:0 auto 20px}
.welcome h1{font-size:27px;margin:0 0 10px}
.welcome p{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}
.card{background:var(--panel);border:1px solid var(--border);
 border-radius:16px;padding:16px;text-align:left}
.card:hover{border-color:var(--accent)}
.card b{display:block;margin-bottom:5px;font-size:14px}
.card span{color:var(--muted);font-size:12px}
.message{margin:0 0 24px}
.user{display:flex;justify-content:flex-end}
.bubble{max-width:90%;padding:14px 16px;border-radius:18px;
 line-height:1.65;font-size:15px;overflow-wrap:anywhere}
.user .bubble{background:var(--user);color:white;border-bottom-right-radius:5px}
.assistant .bubble{background:var(--panel);border:1px solid var(--border);
 border-bottom-left-radius:5px}
.bubble pre{background:#0b0b10;color:#eee;padding:14px;
 border-radius:12px;overflow:auto}
.bubble code{font-family:monospace}
.bubble:not(pre) code{background:var(--panel2);padding:2px 5px;border-radius:5px}
.bubble ul,.bubble ol{padding-left:22px}
.bubble a{color:var(--accent)}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{border:0;background:transparent;color:var(--muted);
 font-size:12px;padding:6px}
.actions button:hover{color:var(--text)}
.typing{padding:12px;color:var(--muted);font-size:13px}
.footer{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.footerinner{max-width:760px;margin:auto}
.inputbox{background:var(--panel);border:1px solid var(--border);
 border-radius:22px;padding:9px;display:flex;align-items:flex-end;gap:8px}
textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;
 color:var(--text);resize:none;padding:11px;max-height:180px;line-height:1.5}
textarea::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border:0;border-radius:15px;
 background:var(--accent);color:white;font-size:21px}
.send:disabled{opacity:.4}
.footerhint{text-align:center;font-size:10px;color:var(--muted);padding-top:10px}
.overlay{display:none}
@media(max-width:700px){
 .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:5;
  width:280px;transform:translateX(-110%);box-shadow:0 0 40px #0005}
 .sidebar.open{transform:translateX(0)}
 .overlay.show{display:block;position:fixed;inset:0;z-index:4;background:#0007}
 .chat{padding:16px 12px}
 .bubble{max-width:94%}
 .cards{grid-template-columns:1fr}
 .welcome{padding:35px 8px}
 .welcome h1{font-size:23px}
}
</style>
</head>
<body>
<div class="app">
 <div class="overlay" id="overlay"></div>

 <aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">✦</div><strong>NEURA AI</strong></div>
  <button class="newchat" id="newchat">＋ Новый чат</button>
  <input class="search" id="search" placeholder="⌕ Поиск по чатам">
  <div class="chatlist" id="chatlist"></div>
  <div class="sidebottom">
   <button class="sidebtn" id="theme">◐ Сменить тему</button>
   <button class="sidebtn" id="clearall">⌫ Очистить все чаты</button>
   <div style="padding:12px;color:var(--muted);font-size:11px">NEURA AI · 2.0</div>
  </div>
 </aside>

 <main class="main">
  <header class="header">
   <div class="headleft">
    <button class="iconbtn" id="menu">☰</button>
    <div>
     <div class="headername" id="title">NEURA AI</div>
     <div class="headerstatus">AI Assistant</div>
    </div>
   </div>
   <button class="iconbtn" id="newtop" title="Новый чат">＋</button>
  </header>

  <section class="chat" id="chat">
   <div class="chatinner" id="chatinner"></div>
  </section>

  <footer class="footer">
   <div class="footerinner">
    <div class="inputbox">
     <textarea id="input" rows="1" placeholder="Спроси что-нибудь..."></textarea>
     <button class="send" id="send" disabled>↑</button>
    </div>
    <div class="footerhint">NEURA AI может ошибаться · Проверяй важную информацию</div>
   </div>
  </footer>
 </main>
</div>

<script>
(()=>{
 const tg=window.Telegram?.WebApp;
 tg?.ready();tg?.expand();

 const $=id=>document.getElementById(id);
 const chat=$('chat'),inner=$('chatinner'),input=$('input');
 const send=$('send'),sidebar=$('sidebar'),overlay=$('overlay');

 // Backend должен вернуть JSON: { "reply": "ответ" }
 const API_URL='/api/chat';

 let chats=[];
 let current=null;
 let busy=false;

 try{
  chats=JSON.parse(localStorage.getItem('neura2_chats')||'[]');
  if(!Array.isArray(chats))chats=[];
 }catch{chats=[]}

 try{
  if(localStorage.getItem('neura2_theme')==='light')
   document.body.classList.add('light');
 }catch{}

 function persist(){
  try{localStorage.setItem('neura2_chats',JSON.stringify(chats))}
  catch{console.warn('Не удалось сохранить историю')}
 }

 function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 }

 function closeSide(){
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
 }

 function openSide(){
  sidebar.classList.add('open');
  overlay.classList.add('show');
 }

 $('menu').onclick=openSide;
 overlay.onclick=closeSide;

 function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
   '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
 }

 // Простое безопасное форматирование
 function format(s){
  s=escapeHTML(s);

  // Кодовые блоки
  s=s.replace(/```([\w-]*)\n?([\s\S]*?)```/g,
   (_,lang,code)=>'<pre><code>'+code+'</code></pre>');

  // Inline code
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');

  // Жирный и курсив
  s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*(.*?)\*/g,'<em>$1</em>');

  // Ссылки
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
   '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Списки
  s=s.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>');

  // Заголовки
  s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^## (.+)$/gm,'<h2>$1</h2>');

  s=s.replace(/\n/g,'<br>');
  return s;
 }

 function welcome(){
  inner.innerHTML=`
   <div class="welcome">
    <div class="welcomeicon">✦</div>
    <h1>Чем могу помочь?</h1>
    <p>Твой интеллектуальный помощник</p>
    <div class="cards">
     <button class="card" data-prompt="Придумай идею для проекта">
      <b>💡 Идеи</b><span>Найти вдохновение</span>
     </button>
     <button class="card" data-prompt="Объясни сложную тему простыми словами">
      <b>🧠 Обучение</b><span>Разобраться в теме</span>
     </button>
     <button class="card" data-prompt="Напиши красивую историю">
      <b>✍️ Творчество</b><span>Создать текст</span>
     </button>
     <button class="card" data-prompt="Помоги написать программу">
      <b>💻 Код</b><span>Помощь с программированием</span>
     </button>
    </div>
   </div>`;
  inner.querySelectorAll('[data-prompt]').forEach(b=>{
   b.onclick=()=>{input.value=b.dataset.prompt;update();sendMessage()}
  });
 }

 function draw(){
  inner.innerHTML='';
  if(!current){welcome();$('title').textContent='NEURA AI';return}
  const c=chats.find(x=>x.id===current);
  if(!c){current=null;welcome();return}
  $('title').textContent=c.title||'Новый чат';
  if(!c.messages.length){welcome();return}
  c.messages.forEach((m,i)=>renderMessage(m,i));
 }

 function renderMessage(m,i){
  const wrap=document.createElement('div');
  wrap.className='message '+m.role;

  const bubble=document.createElement('div');
  bubble.className='bubble';

  if(m.role==='assistant')bubble.innerHTML=format(m.content);
  else bubble.textContent=m.content;

  wrap.appendChild(bubble);

  if(m.role==='assistant'){
   const actions=document.createElement('div');
   actions.className='actions';

   const copy=document.createElement('button');
   copy.textContent='▣ Копировать';
   copy.onclick=async()=>{
    try{
     await navigator.clipboard.writeText(m.content);
     copy.textContent='✓ Скопировано';
     setTimeout(()=>copy.textContent='▣ Копировать',1200);
    }catch{copy.textContent='Ошибка копирования'}
   };

   const regen=document.createElement('button');
   regen.textContent='↻ Повтор';
   regen.onclick=()=>regenerate();

   actions.append(copy,regen);
   wrap.appendChild(actions);
  }

  if(m.role==='user'&&i===currentMessages().length-1){
   const actions=document.createElement('div');
   actions.className='actions';
   const edit=document.createElement('button');
   edit.textContent='✎ Изменить';
   edit.onclick=()=>{
    input.value=m.content;
    update();
    input.focus();
   };
   actions.appendChild(edit);
   wrap.appendChild(actions);
  }

  inner.appendChild(wrap);
 }

 function currentMessages(){
  return chats.find(x=>x.id===current)?.messages||[];
 }

 function renderList(){
  const q=$('search').value.toLowerCase();
  $('chatlist').innerHTML='';
  chats.slice().reverse().filter(c=>{
   return (c.title||'').toLowerCase().includes(q)||
    c.messages.some(m=>m.content.toLowerCase().includes(q));
  }).forEach(c=>{
   const el=document.createElement('div');
   el.className='chatitem'+(c.id===current?' active':'');
   const name=document.createElement('div');
   name.className='chatname';
   name.textContent=c.title||'Новый чат';
   name.onclick=()=>{current=c.id;draw();renderList();closeSide()};

   const del=document.createElement('button');
   del.className='delchat';
   del.textContent='×';
   del.title='Удалить чат';
   del.onclick=e=>{
    e.stopPropagation();
    if(busy&&current===c.id)return;
    chats=chats.filter(x=>x.id!==c.id);
    if(current===c.id)current=null;
    persist();draw();renderList();
   };

   el.append(name,del);
   $('chatlist').appendChild(el);
  });
 }

 function createChat(){
  if(busy)return;
  const c={id:id(),title:'Новый чат',messages:[],created:Date.now()};
  chats.push(c);current=c.id;
  persist();draw();renderList();closeSide();
  input.focus();
 }

 $('newchat').onclick=createChat;
 $('newtop').onclick=createChat;
 $('search').oninput=renderList;

 $('clearall').onclick=()=>{
  if(busy)return;
  if(!chats.length)return;
  if(!confirm('Удалить все чаты?'))return;
  chats=[];current=null;persist();draw();renderList();closeSide();
 };

 $('theme').onclick=()=>{
  document.body.classList.toggle('light');
  try{
   localStorage.setItem('neura2_theme',
    document.body.classList.contains('light')?'light':'dark');
  }catch{}
 };

 function update(){
  send.disabled=busy||!input.value.trim();
 }

 input.addEventListener('input',()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,180)+'px';
  update();
 });

 input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
   e.preventDefault();sendMessage();
  }
 });

 function scroll(){
  chat.scrollTop=chat.scrollHeight;
 }

 async function requestAI(history){
  const r=await fetch(API_URL,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:history.slice(-20)})
  });
  if(!r.ok)throw new Error('Ошибка сервера: '+r.status);
  const data=await r.json();
  if(typeof data.reply!=='string'||!data.reply.trim())
   throw new Error('Некорректный ответ сервера');
  return data.reply;
 }

 async function sendMessage(){
  const text=input.value.trim();
  if(!text||busy)return;

  if(!current)createChat();
  const c=chats.find(x=>x.id===current);
  if(!c)return;

  input.value='';
  input.style.height='auto';
  busy=true;update();

  c.messages.push({role:'user',content:text});
  if(c.title==='Новый чат')
   c.title=text.slice(0,40)+(text.length>40?'…':'');
  persist();draw();renderList();scroll();

  const typing=document.createElement('div');
  typing.className='typing';
  typing.textContent='✦ NEURA AI думает...';
  inner.appendChild(typing);scroll();

  try{
   const answer=await requestAI(c.messages);
   typing.remove();
   c.messages.push({role:'assistant',content:answer});
   persist();draw();renderList();
  }catch(err){
   typing.remove();
   const error=document.createElement('div');
   error.className='message assistant';
   error.innerHTML='<div class="bubble">Не удалось получить ответ. Проверь сервер или попробуй ещё раз.</div>';
   inner.appendChild(error);
   console.error(err);
  }finally{
   busy=false;update();scroll();
  }
 }

 async function regenerate(){
  if(busy||!current)return;
  const c=chats.find(x=>x.id===current);
  if(!c||!c.messages.length)return;
  if(c.messages[c.messages.length-1].role==='assistant')
   c.messages.pop();
  if(c.messages[c.messages.length-1]?.role!=='user')return;

  busy=true;update();persist();draw();

  const typing=document.createElement('div');
  typing.className='typing';
  typing.textContent='✦ NEURA AI думает...';
  inner.appendChild(typing);scroll();

  try{
   const answer=await requestAI(c.messages);
   typing.remove();
   c.messages.push({role:'assistant',content:answer});
   persist();draw();
  }catch(e){
   typing.remove();
   const err=document.createElement('div');
   err.className='message assistant';
   err.innerHTML='<div class="bubble">Не удалось повторить ответ.</div>';
   inner.appendChild(err);
  }finally{
   busy=false;update();scroll();
  }
 }

 send.onclick=sendMessage;
 draw();renderList();update();
})();
</script>
</body>
</html>
